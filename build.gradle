buildscript {
    repositories {
        google()
        mavenCentral()
        // Read-only since 2021; kept only as a fallback for old AGP 3.2 transitive dependencies.
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.2.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
    }
}
